<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>窗外風景單字</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column. A hospital window starts as a bare brick wall; each cleared mission paints another part of the view the old man describes. */
:root{
  --bg:#EDF3F1; --surface:#FFFFFF; --surface2:#E2EBE8; --ink:#13302E; --ink2:#486562; --line:#C8D7D3;
  --brand:#1D6A67; --on-brand:#FFFFFF; --glow:#F2B93B; --on-glow:#3B2A00;
  --ok:#1E8750; --ok-bg:#DDF1E5; --ok-ink:#115C35;
  --bad:#C23F37; --bad-bg:#F9E2DF; --bad-ink:#8E241E;
  --info:#2D68AE; --info-bg:#DEEAF7; --info-ink:#1B4E8A;
  --wall:#CBC1B3; --wall-line:#B5AA9B; --sky-a:#86C5EC; --sky-b:#DDF1FA; --hill:#8FBF7E; --lake:#4A9BC8; --lake-hi:#9ACFE8;
  --grass:#76B063; --path:#E4D4B2; --frame:#F8F6F1; --frame-edge:#B9B2A5; --duck:#F2C14E; --beak:#E8873A; --cloud:#FFFFFF;
  --swan:#FFFFFF; --skin:#E9B98F; --c1:#E0607E; --c2:#3A6EA5; --cart:#D9654B; --scoop:#F3A6C0; --cone:#D7A25E; --hull:#7A4B2A; --sail:#FFFFFF; --sail2:#E0607E;
  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  --font-word:"Andika","Noto Sans TC",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1817; --surface:#142423; --surface2:#1B312F; --ink:#E3F0ED; --ink2:#95B2AE; --line:#2A4441;
    --brand:#58BDB6; --on-brand:#062321; --glow:#F2B93B; --on-glow:#3B2A00;
    --ok:#5FD08E; --ok-bg:#12301F; --ok-ink:#8FE6B0;
    --bad:#FF8A80; --bad-bg:#3A1816; --bad-ink:#FFB4AC;
    --info:#7DB4F0; --info-bg:#14283F; --info-ink:#A9CDF7;
    --wall:#47423B; --wall-line:#38342E; --sky-a:#1B3A5E; --sky-b:#4C79A3; --hill:#3C6B4A; --lake:#2A6A93; --lake-hi:#4F97BD;
    --grass:#3F7A3F; --path:#8A7B5C; --frame:#C9C4BA; --frame-edge:#8E887C; --duck:#E5B445; --beak:#E8873A; --cloud:#B9C9D8;
    --swan:#E8EEF2; --skin:#D9A981; --c1:#D4566F; --c2:#4D84C0; --cart:#C95A42; --scoop:#E597B2; --cone:#C79552; --hull:#6A4126; --sail:#E8EEF2; --sail2:#D4566F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1817; --surface:#142423; --surface2:#1B312F; --ink:#E3F0ED; --ink2:#95B2AE; --line:#2A4441;
  --brand:#58BDB6; --on-brand:#062321; --glow:#F2B93B; --on-glow:#3B2A00;
  --ok:#5FD08E; --ok-bg:#12301F; --ok-ink:#8FE6B0;
  --bad:#FF8A80; --bad-bg:#3A1816; --bad-ink:#FFB4AC;
  --info:#7DB4F0; --info-bg:#14283F; --info-ink:#A9CDF7;
  --wall:#47423B; --wall-line:#38342E; --sky-a:#1B3A5E; --sky-b:#4C79A3; --hill:#3C6B4A; --lake:#2A6A93; --lake-hi:#4F97BD;
  --grass:#3F7A3F; --path:#8A7B5C; --frame:#C9C4BA; --frame-edge:#8E887C; --duck:#E5B445; --beak:#E8873A; --cloud:#B9C9D8;
  --swan:#E8EEF2; --skin:#D9A981; --c1:#D4566F; --c2:#4D84C0; --cart:#C95A42; --scoop:#E597B2; --cone:#C79552; --hull:#6A4126; --sail:#E8EEF2; --sail2:#D4566F;
  color-scheme: dark;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0; background:var(--bg); color:var(--ink); font:400 16px/1.55 var(--font-ui);
  padding-block:12px 28px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:520px; margin:0 auto}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
button{font-family:inherit}
.screen{display:block}
.row{display:flex; align-items:center; gap:10px}
.grow{flex:1; min-width:0}
.muted{color:var(--ink2)}
.small{font-size:13px}
.word{font-family:var(--font-word)}

/* buttons */
.btn{appearance:none; border:0; border-radius:12px; min-height:48px; padding:0 20px; font:700 16px var(--font-ui); cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none}
.btn.primary{background:var(--brand); color:var(--on-brand)}
.btn.glow{background:var(--glow); color:var(--on-glow)}
.btn.secondary{background:var(--surface); color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost{background:transparent; color:var(--ink2); padding:0 12px}
.btn.block{width:100%}
.btn.sm{min-height:40px; padding:0 14px; font-size:14px; border-radius:10px}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.tile:focus-visible,.key:focus-visible,input:focus-visible{outline:3px solid var(--glow); outline-offset:2px}
.ico{width:20px; height:20px; flex:none; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}

/* login */
.hero{display:grid; gap:14px; padding-top:4px}
.hero h1{font-size:30px; line-height:1.2; font-weight:700}
.hero .en{font:700 15px var(--font-word); letter-spacing:.04em; color:var(--brand)}
.field{display:grid; gap:6px}
.field label{font-weight:700; font-size:14px}
.field input{height:50px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); padding:0 14px; font:500 18px var(--font-ui); width:100%}
.form{display:grid; gap:14px}
.fields{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.fields .full{grid-column:1 / -1}
.err{color:var(--bad-ink); font-weight:700; min-height:22px; font-size:14px}
.tip{display:flex; gap:10px; align-items:flex-start; background:var(--info-bg); color:var(--info-ink); padding:12px 14px; border-radius:12px; font-size:14px}

/* scene */
.scene{display:block; width:100%; height:auto}
.brick-bg{fill:var(--wall)} .brick-line{stroke:var(--wall-line); stroke-width:1; fill:none}
.sky-a{stop-color:var(--sky-a)} .sky-b{stop-color:var(--sky-b)}
.sun{fill:var(--glow)} .cloud{fill:var(--cloud); opacity:.85} .hill{fill:var(--hill)} .lake{fill:var(--lake)}
.ripple{fill:none; stroke:var(--lake-hi); stroke-width:2; stroke-linecap:round}
.grass{fill:var(--grass)} .walk{fill:var(--path)}
.swan{fill:var(--swan)} .swan-neck{fill:none; stroke:var(--swan); stroke-width:5; stroke-linecap:round}
.duck{fill:var(--duck)} .beak{fill:var(--beak)}
.hull{fill:var(--hull)} .mast{stroke:var(--hull); stroke-width:2; fill:none} .sail{fill:var(--sail)} .sail2{fill:var(--sail2)}
.skin{fill:var(--skin)} .cl1{fill:var(--c1)} .cl2{fill:var(--c2)} .leg{stroke:var(--ink); stroke-width:2.4; stroke-linecap:round; fill:none}
.cart{fill:var(--cart)} .wheel{fill:var(--ink)} .umb-a{fill:var(--cloud)} .umb-b{fill:var(--cart)} .scoop{fill:var(--scoop)} .cone{fill:var(--cone)}
.frame{fill:none; stroke:var(--frame); stroke-width:14} .pane-edge{fill:none; stroke:var(--frame-edge); stroke-width:1.5}
.sill{fill:var(--frame); stroke:var(--frame-edge); stroke-width:1}
.layer{opacity:0; transition:opacity 1s ease}
.layer.ghost{opacity:.16}
.layer.on{opacity:1}
.scene-box{border-radius:14px; overflow:hidden}

/* home */
.top{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.chip{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; background:var(--surface2); font-weight:700; font-size:14px}
.score-card{display:grid; gap:8px; margin-top:14px}
.score-line{display:flex; align-items:baseline; gap:8px}
.score-num{font:700 44px/1 var(--font-word); font-variant-numeric:tabular-nums}
.bar{height:10px; border-radius:99px; background:var(--surface2); overflow:hidden}
.bar > i{display:block; height:100%; background:var(--brand); border-radius:99px; transition:width .4s ease}
.missions{display:grid; gap:10px; margin-top:16px}
.mrow{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; background:var(--surface); border-radius:14px; padding:12px 14px; box-shadow:0 0 0 1px var(--line)}
.mrow.next{box-shadow:0 0 0 2px var(--brand)}
.mrow.locked{opacity:.6}
.badge{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font:700 18px var(--font-word); background:var(--surface2)}
.mrow.done .badge{background:var(--ok-bg); color:var(--ok-ink)}
.mrow.next .badge{background:var(--brand); color:var(--on-brand)}
.mname{font-weight:700}
.mitems{font:400 13px var(--font-word); color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.stars{display:inline-flex; gap:2px}
.star{width:16px; height:16px; fill:none; stroke:var(--ink2); stroke-width:1.6}
.star.on{fill:var(--glow); stroke:var(--glow)}
.actions{display:grid; gap:10px; margin-top:16px}

/* preview */
.pv{display:grid; gap:12px; margin-top:12px}
.pvc{background:var(--surface); border-radius:14px; padding:14px; box-shadow:0 0 0 1px var(--line); display:grid; gap:8px}
.pvw{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.pvw .grow{min-width:140px}
.pvword{font:700 30px/1.15 var(--font-word)}
.pvword .ck{display:inline-block; padding:0 1px; border-radius:4px; transition:background .15s}
.pvword .ck.hl{background:var(--glow); color:var(--on-glow)}
.pvword .dot{color:var(--ink2); font-weight:400; margin:0 1px}
.kk{font:400 14px var(--font-word); color:var(--ink2)}
.pos{display:inline-block; font:700 12px var(--font-word); background:var(--surface2); border-radius:6px; padding:1px 7px; margin-right:6px}
.pvs{font:400 16px/1.55 var(--font-word)}
.pvs b{background:color-mix(in srgb, var(--glow) 45%, transparent); border-radius:4px; padding:0 2px}
.xtra{font-size:13px; color:var(--info-ink); background:var(--info-bg); border-radius:8px; padding:4px 10px; width:fit-content}

/* play */
.ptop{display:flex; align-items:center; gap:10px}
.progress{flex:1; height:12px; border-radius:99px; background:var(--surface2); overflow:hidden}
.progress > i{display:block; height:100%; width:0; background:var(--glow); border-radius:99px; transition:width .35s ease}
.pmeta{display:flex; align-items:center; gap:10px; margin-top:10px; font-size:14px}
.stagechip{font-weight:700; background:var(--brand); color:var(--on-brand); border-radius:999px; padding:2px 12px}
.exitbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--bad-bg); color:var(--bad-ink); border-radius:12px; padding:10px 12px; margin-top:10px; font-weight:700; font-size:14px}
.warn{background:var(--glow); color:var(--on-glow); border-radius:12px; padding:10px 12px; margin-top:10px; font-size:14px; font-weight:700}
#qArea{display:flex; flex-direction:column; gap:16px; padding-block:14px 8px; min-height:240px}
.prompt{font-size:15px; color:var(--ink2)}
.zh-big{font-size:28px; font-weight:700; line-height:1.3}
.audio{display:flex; gap:8px; flex-wrap:wrap}
.opts{display:grid; gap:10px}
.opt{appearance:none; min-height:58px; text-align:left; padding:12px 16px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); font:500 19px var(--font-ui); cursor:pointer}
.opt.word-opt{font-family:var(--font-word); font-weight:700; font-size:20px}
.opt:disabled{cursor:default}
.opt.bad{background:var(--bad-bg); border-color:var(--bad); color:var(--bad-ink)}
.opt.ok{background:var(--ok-bg); border-color:var(--ok); color:var(--ok-ink)}
.sent{font:400 21px/1.7 var(--font-word)}
.blank{display:inline-block; min-width:92px; border-bottom:3px solid var(--ink2); text-align:center; font-weight:700}
.blank.filled{border-color:var(--ok); color:var(--ok-ink)}
.sz{font-size:15px; color:var(--ink2)}
.note{min-height:22px; font-size:14px; font-weight:700; color:var(--info-ink)}
.note.bad{color:var(--bad-ink)}

.slots{display:flex; gap:5px; justify-content:center}
.slot{flex:1 1 0; max-width:46px; min-width:24px; height:58px; border-radius:10px; border:2px solid var(--line); background:var(--surface);
  display:grid; place-items:center; font:700 28px var(--font-word); color:var(--ink)}
.slot.given{background:transparent; border-color:transparent}
.slot.empty{border-style:dashed; border-color:var(--ink2)}
.slot.cursor{border-style:solid; border-color:var(--brand); box-shadow:0 0 0 3px color-mix(in srgb, var(--brand) 30%, transparent)}
.slot.filled{border-color:var(--brand)}
.slot.ok{background:var(--ok-bg); border-color:var(--ok); color:var(--ok-ink)}
.slot.bad{background:var(--bad-bg); border-color:var(--bad); color:var(--bad-ink)}
.slot.hint{background:var(--info-bg); border-color:var(--info); color:var(--info-ink)}
.slot.reveal{background:var(--glow); border-color:var(--glow); color:var(--on-glow)}

.tslots,.tpool{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; min-height:58px}
.tslot,.tile{appearance:none; min-width:58px; height:56px; padding:0 14px; border-radius:10px; font:700 24px var(--font-word); color:var(--ink)}
.tslot{border:2px dashed var(--ink2); background:transparent}
.tslot.filled{border:2px solid var(--brand); background:var(--surface); cursor:pointer}
.tslot.ok{background:var(--ok-bg); border-color:var(--ok); color:var(--ok-ink)}
.tslot.bad{background:var(--bad-bg); border-color:var(--bad); color:var(--bad-ink)}
.tslot.reveal{background:var(--glow); border-color:var(--glow); color:var(--on-glow)}
.tile{border:2px solid var(--line); background:var(--surface); box-shadow:0 3px 0 var(--line); cursor:pointer}
.tile:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line)}
.divider{height:1px; background:var(--line)}

.dock{position:sticky; bottom:0; background:var(--bg); padding:8px 0 calc(10px + env(safe-area-inset-bottom, 0px)); display:grid; gap:8px}
.dock:empty{display:none}
.dockrow{display:flex; gap:8px}
.dockrow .btn{flex:1}
.kb{display:grid; gap:6px}
.kbrow{display:flex; gap:5px; justify-content:center}
.key{appearance:none; flex:1 1 0; max-width:42px; height:48px; border-radius:8px; border:0; background:var(--surface); color:var(--ink);
  box-shadow:0 2px 0 var(--line), 0 0 0 1px var(--line); font:700 20px var(--font-word); cursor:pointer; padding:0}
.key.wide{max-width:60px; flex:1.5 1 0}
.key:active{background:var(--surface2)}
.fb{border-radius:14px; padding:12px 14px; display:grid; gap:10px}
.fb.ok{background:var(--ok-bg); color:var(--ok-ink)}
.fb.part{background:var(--info-bg); color:var(--info-ink)}
.fb.bad{background:var(--bad-bg); color:var(--bad-ink)}
.fb .msg{font-weight:700; font-size:17px}
.fb .msg .word{font-size:20px}
.fb .btn{background:var(--ink); color:var(--bg)}

/* interlude / result */
.center{display:grid; gap:16px; justify-items:center; text-align:center; padding-top:28px}
.stage-no{font:700 14px var(--font-word); letter-spacing:.08em; color:var(--brand)}
.center h2{font-size:28px; line-height:1.25}
.center p{max-width:30ch}
.bigscore{font:700 64px/1 var(--font-word); font-variant-numeric:tabular-nums}
.chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.wchip{font:700 15px var(--font-word); background:var(--bad-bg); color:var(--bad-ink); border-radius:8px; padding:3px 10px}
.reveal-line{font-weight:700; color:var(--ok-ink); background:var(--ok-bg); border-radius:12px; padding:8px 14px}
.stack{display:grid; gap:10px; width:100%}

/* report */
.report{background:var(--surface); border-radius:18px; padding:18px; box-shadow:0 0 0 1px var(--line); display:grid; gap:14px}
.rh{display:flex; justify-content:space-between; align-items:baseline; gap:8px; border-bottom:2px solid var(--ink); padding-bottom:8px}
.rh b{font-size:17px}
.rh span{font:400 13px var(--font-word); color:var(--ink2)}
.who{display:grid; grid-template-columns:auto auto 1fr; gap:6px 16px; align-items:end}
.who div{display:grid; gap:0}
.who small{font-size:12px; color:var(--ink2)}
.who strong{font-size:26px; line-height:1.2}
.total{display:flex; align-items:baseline; gap:8px}
.total .score-num{font-size:64px}
.mr{display:grid; grid-template-columns:5.2em 1fr auto; gap:10px; align-items:center; font-size:14px}
.mr .bar{height:8px}
.mr .val{font:700 15px var(--font-word); font-variant-numeric:tabular-nums}
.copybox{display:grid; gap:8px}
.copybox input{height:44px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); padding:0 10px; font:400 14px var(--font-ui); width:100%}

@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
@media (max-width:360px){ .fields{grid-template-columns:1fr} .score-num{font-size:38px} }
</style>

<div class="wrap">

<section id="s-login" class="screen">
  <div class="hero">
    <div class="scene-box" id="login-scene"></div>
    <div>
      <div class="en">B1L3 · The Hospital Window</div>
      <h1>窗外風景單字</h1>
      <p class="muted">完成 5 個任務，讓窗外的風景一個一個出現。</p>
    </div>
    <form class="form" id="login-form" autocomplete="off" novalidate>
      <div class="fields">
        <div class="field full"><label for="f-class">班級（可不填）</label><input id="f-class" type="text" maxlength="12" placeholder="例如：資一甲"></div>
        <div class="field"><label for="f-seat">座號</label><input id="f-seat" type="text" inputmode="numeric" maxlength="2" placeholder="例如：12"></div>
        <div class="field"><label for="f-name">姓名</label><input id="f-name" type="text" maxlength="12" placeholder="例如：王小明"></div>
      </div>
      <div class="err" id="login-err" role="alert"></div>
      <button class="btn primary block" type="submit" id="btn-start">開始</button>
      <button class="btn secondary block" type="button" id="btn-test">測試發音</button>
    </form>
    <div class="tip">
      <svg class="ico" viewBox="0 0 24 24"><path d="M3 10v4h4l5 4V6L7 10H3z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>
      <span>請戴上耳機，並先按「測試發音」確認聽得到聲音。手機的靜音鍵要關掉。</span>
    </div>
  </div>
</section>

<section id="s-home" class="screen" hidden><div id="home"></div></section>

<section id="s-preview" class="screen" hidden><div id="preview"></div></section>

<section id="s-inter" class="screen" hidden><div id="inter"></div></section>

<section id="s-play" class="screen" hidden>
  <div class="ptop">
    <button class="btn ghost" type="button" id="btn-exit" aria-label="離開">
      <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="progress" role="progressbar" aria-label="任務進度"><i id="prog"></i></div>
    <button class="btn ghost" type="button" id="btn-mute" aria-label="音效開關"><span id="mute-t">音效開</span></button>
  </div>
  <div class="pmeta"><span class="stagechip" id="stage-chip"></span><span class="muted" id="stage-count"></span><span class="grow"></span><span class="chip" id="live-score"></span></div>
  <div class="exitbar" id="exitbar" hidden>
    <span class="grow">離開會失去這一次的進度。</span>
    <button class="btn sm secondary" type="button" id="exit-yes">離開</button>
    <button class="btn sm primary" type="button" id="exit-no">繼續</button>
  </div>
  <div class="warn" id="audio-warn" hidden>沒有聽到聲音嗎？請確認音量、耳機和手機靜音鍵，或改用 Chrome／Safari 開啟。</div>
  <div id="qArea"></div>
  <div class="note" id="note" aria-live="polite"></div>

/* ---------- preview ---------- */

/* ---------- run ---------- */
function stagesFor(m){ return m.kind === "word" ? ["listen","build","fill","spell","cloze"] : ["listen","build","cloze"]; }
function startMission(m){
  var stages = stagesFor(m), seq = [];
  stages.forEach(function(st){ shuffle(m.items.slice()).forEach(function(id){ seq.push({stage:st, id:id}); }); });
  S.run = {mission:m, stages:stages, seq:seq, i:0, sum:0, perQ:20 / seq.length, missed:{}, itemMin:{}, time:0, scored:true, q:null, right:0};
  beginStageOrQuestion(true);
}
function startPractice(){
  var ids = shuffle(weakIds()).slice(0, 8), seq = [];
  ids.forEach(function(id){ seq.push({stage:ITEM[id].kind === "word" ? "spell" : "build", id:id}); });
  shuffle(ids.slice()).forEach(function(id){ seq.push({stage:"cloze", id:id}); });
  S.run = {mission:null, stages:[], seq:seq, i:0, sum:0, perQ:0, missed:{}, itemMin:{}, time:0, scored:false, q:null, right:0};
  beginStageOrQuestion(true);
}
function beginStageOrQuestion(force){

  else { show("play"); renderQuestion(); }
}
function showInter(stage){
  var r = S.run, box = $("#inter"); box.textContent = "";

  var desc = (stage === "build" && r.mission && r.mission.kind === "phrase") ? BUILD_PHRASE_DESC : STAGE[stage].d;
  if (!r.mission && stage === "build") desc = BUILD_PHRASE_DESC;
  box.appendChild(el("div", {class:"center"},
    el("div", {class:"stage-no", text:no}),
    el("h2", {text:STAGE[stage].n}),
    el("p", {class:"muted", text:desc}),
    el("div", {class:"stack"}, el("button", {class:"btn primary block", type:"button", text:"開始", onclick:function(){ show("play"); renderQuestion(); }}))
  ));
  show("inter");
}
function renderQuestion(){
  var r = S.run, cur = r.seq[r.i], item = ITEM[cur.id];

  $("#exitbar").hidden = true; $("#audio-warn").hidden = true;

}
function updateMeta(){
  var r = S.run, cur = r.seq[r.i];
  $("#prog").style.width = Math.round(r.i / r.seq.length * 100) + "%";
  $("#stage-chip").textContent = (r.mission ? "第 " + (r.stages.indexOf(cur.stage) + 1) + " 關 " : "練習 ") + STAGE[cur.stage].n;
  var n = 0, tot = 0;
  r.seq.forEach(function(x, k){ if (x.stage === cur.stage){ tot++; if (k <= r.i) n++; } });
  $("#stage-count").textContent = n + " / " + tot;
  $("#live-score").textContent = r.scored ? "本任務 " + Math.round(r.sum * r.perQ) + " 分" : "練習不計分";
}
function setNote(msg, bad){ var n = $("#note"); n.textContent = msg || ""; n.className = "note" + (bad ? " bad" : ""); }
function label(item){ return el("span", {}, el("span", {class:"word", text:item.en}), "　" + item.zh); }

function finishQ(val){
  var r = S.run, q = r.q, item = q.item;
  q.over = true; q.busy = false; r.sum += val; if (val === 1) r.right++;
  var spent = (Date.now() - q.t0) / 1000; r.time += Math.min(spent, 90);
  r.itemMin[item.id] = Math.min(r.itemMin[item.id] === undefined ? 1 : r.itemMin[item.id], val);
  tone(val === 1 ? SND.ok : val > 0 ? SND.part : SND.bad);
  setNote("");
  updateMeta(); $("#prog").style.width = Math.round((r.i + 1) / r.seq.length * 100) + "%";
  var dock = $("#dock"); dock.textContent = "";
  var cls = val === 1 ? "ok" : val > 0 ? "part" : "bad";
  var msg = val === 1 ? "答對了！" : val > 0 ? "答對了，這題只拿到一半分數。" : "正確答案是：";
  var btn = el("button", {class:"btn block", type:"button", text:(r.i + 1 >= r.seq.length) ? "看結果" : "繼續", onclick:next});
  dock.appendChild(el("div", {class:"fb " + cls}, el("div", {class:"msg"}, msg + " ", label(item)), btn));
  setTimeout(function(){ try { btn.focus(); } catch(e){} }, 50);
}
function next(){
  var r = S.run; if (!r || !r.q || !r.q.over) return;
  TTS.stop();
  r.i++;
  if (r.i >= r.seq.length) finishRun(); else beginStageOrQuestion(false);

/* ---------- stage: listen ---------- */
function poolFor(item){
  var m = S.run.mission, base;
  if (m && m.kind === item.kind) base = m.items.map(function(i){ return ITEM[i]; });
  if (!base || base.length < 4) base = item.kind === "word" ? WORDS : PHRASES;
  return base;
}
function audioFor(item){ return audioRow(item.en); }
function rListen(item){
  var q = S.run.q, area = $("#qArea");
  var pool = poolFor(item).filter(function(x){ return x.id !== item.id && x.zh !== item.zh; });
  var opts = shuffle([item].concat(shuffle(pool.slice()).slice(0, 2)));
  var wrap = el("div", {class:"opts"});
  opts.forEach(function(o){
    var b = el("button", {class:"opt", type:"button", text:o.zh});
    b.addEventListener("click", function(){
      if (q.over) return;

      else {
        q.attempts++; b.classList.add("bad"); b.disabled = true; tone(SND.bad);
        if (q.attempts >= 2){
          Array.prototype.forEach.call(wrap.children, function(x){ if (x.textContent === item.zh) x.classList.add("ok"); });
          lockAll(); finishQ(0);
        } else setNote("不是這個。再聽一次，選選看。", true);
      }
    });
    wrap.appendChild(b);
  });
  function lockAll(){ Array.prototype.forEach.call(wrap.children, function(x){ x.disabled = true; }); }
  area.appendChild(el("p", {class:"prompt", text:"聽一聽，這個" + (item.kind === "word" ? "字" : "片語") + "是什麼意思？"}));
  area.appendChild(audioFor(item));
  area.appendChild(wrap);
  say(item.en, 0.9);
}

/* ---------- stage: build (tiles) ---------- */
function rBuild(item){
  var q = S.run.q, area = $("#qArea");
  var parts = item.kind === "word" ? item.ch : item.tiles, n = parts.length;
  var slots = new Array(n); for (var z = 0; z < n; z++) slots[z] = null;
  var tiles = parts.map(function(t, i){ return {id:i, t:t, state:"", locked:false}; });
  var order = shuffle(tiles.slice()), guard = 0;
  while (n > 1 && guard++ < 12 && order.every(function(x, i){ return x.t === parts[i]; })) order = shuffle(tiles.slice());
  var slotsEl = el("div", {class:"tslots"}), poolEl = el("div", {class:"tpool"});
  function draw(){
    slotsEl.textContent = ""; poolEl.textContent = "";
    for (var i = 0; i < n; i++){
      (function(i){
        var t = slots[i];
        var d = el("button", {class:"tslot" + (t ? " filled" : "") + (t && t.state ? " " + t.state : ""), type:"button", text:t ? t.t : ""});
        if (t && !t.locked && !q.over && !q.busy) d.addEventListener("click", function(){ if (q.busy || q.over) return; slots[i] = null; draw(); });
        else d.disabled = true;
        slotsEl.appendChild(d);
      })(i);
    }
    order.forEach(function(t){
      if (slots.indexOf(t) >= 0) return;
      var b = el("button", {class:"tile", type:"button", text:t.t});
      b.addEventListener("click", function(){ place(t); });
      poolEl.appendChild(b);
    });
  }
  function place(t){
    if (q.over || q.busy) return;
    var idx = slots.indexOf(null); if (idx < 0) return;
    slots[idx] = t; t.state = ""; draw();
    if (slots.indexOf(null) < 0) check();
  }
  function check(){
    q.attempts++;
    var allOk = true;
    q.busy = true;
    slots.forEach(function(t, i){ if (t.t === parts[i]) t.state = "ok"; else { t.state = "bad"; allOk = false; } });
    if (allOk){ slots.forEach(function(t){ t.locked = true; }); draw(); finishQ(q.attempts === 1 ? 1 : 0.5); return; }
    tone(SND.bad);
    if (q.attempts >= 2){
      slots = tiles.map(function(t){ t.state = "reveal"; t.locked = true; return t; }); draw(); finishQ(0); return;
    }
    draw(); setNote("紅色的順序不對。對的字塊會留著，其他的退回來再排一次。", true);
    setTimeout(function(){
      slots = slots.map(function(t){ if (!t || t.state === "bad") return null; t.locked = true; return t; });
      q.busy = false; setNote(""); draw();
    }, 1100);
  }
  area.appendChild(el("p", {class:"prompt", text:item.kind === "word" ? "聽發音，把字塊排成這個字" : "聽發音，把單字排成這個片語"}));
  area.appendChild(el("div", {class:"zh-big", text:item.zh}));
  area.appendChild(audioFor(item));
  area.appendChild(slotsEl);
  area.appendChild(el("div", {class:"divider"}));
  area.appendChild(poolEl);
  draw();
  say(item.en, 0.9);
}

/* ---------- stage: fill / spell ---------- */
function rSpell(item, mask){
  var q = S.run.q, area = $("#qArea"), dock = $("#dock");
  q.kind = "spell";
  var word = item.en, L = word.split("");
  var gaps = mask ? item.gaps : L.map(function(_, i){ return i; });
  var sl = L.map(function(ch, i){
    var ed = gaps.indexOf(i) >= 0;
    return {ch:ch, ed:ed, val:ed ? "" : ch, st:ed ? "empty" : "given", locked:!ed};
  });
  var slotsEl = el("div", {class:"slots"});
  var checkBtn = el("button", {class:"btn primary", type:"button", text:"檢查", onclick:function(){ api.check(); }});
  var hintBtn = el("button", {class:"btn secondary", type:"button", onclick:function(){ api.hint(); }}, icon("bulb"), "提示");
  function cursor(){ for (var i = 0; i < sl.length; i++){ if (sl[i].ed && !sl[i].locked && sl[i].val === "") return i; } return -1; }
  function draw(){
    var c = cursor(); slotsEl.textContent = "";
    sl.forEach(function(s, i){ slotsEl.appendChild(el("div", {class:"slot " + s.st + (i === c ? " cursor" : ""), text:s.val})); });
    checkBtn.disabled = (c !== -1) || q.over || q.busy;
    hintBtn.disabled = q.over || q.busy;
  }
  var api = {
    type:function(ch){
      if (q.over || q.busy) return; var i = cursor(); if (i < 0) return;
      sl[i].val = ch; sl[i].st = "filled"; draw();
    },
    back:function(){
      if (q.over || q.busy) return;
      for (var i = sl.length - 1; i >= 0; i--){ if (sl[i].ed && !sl[i].locked && sl[i].val !== ""){ sl[i].val = ""; sl[i].st = "empty"; break; } }
      draw();
    },
    hint:function(){
      if (q.over || q.busy) return;
      for (var i = 0; i < sl.length; i++){
        if (sl[i].ed && !sl[i].locked && sl[i].val !== sl[i].ch){ sl[i].val = sl[i].ch; sl[i].st = "hint"; sl[i].locked = true; q.hint = true; break; }
      }
      setNote("用了提示，這題最多拿一半分數。"); draw();
    },
    check:function(){
      if (q.over || q.busy || cursor() !== -1) return;
      q.attempts++;
      var wrong = 0;
      sl.forEach(function(s){ if (s.ed && !s.locked){ if (s.val === s.ch) s.st = "ok"; else { s.st = "bad"; wrong++; } } });
      draw();
      if (!wrong){
        sl.forEach(function(s){ s.locked = true; });
        finishQ(q.attempts === 1 && !q.hint ? 1 : 0.5); return;
      }
      tone(SND.bad);
      if (q.attempts >= 2){
        sl.forEach(function(s){ if (s.st === "bad"){ s.val = s.ch; s.st = "reveal"; } s.locked = true; });
        draw(); finishQ(0); return;
      }
      q.busy = true; setNote("有 " + wrong + " 個字母不對。對的字母會留著，再試一次。", true);
      setTimeout(function(){
        sl.forEach(function(s){ if (s.st === "bad"){ s.val = ""; s.st = "empty"; } else if (s.st === "ok") s.locked = true; });
        q.busy = false; setNote(""); draw();
      }, 1100);
    }
  };
  q.api = api;
  area.appendChild(el("p", {class:"prompt", text:mask ? "聽發音，補上不見的字母" : "聽發音，把整個字拼出來"}));
  area.appendChild(el("div", {}, item.pos ? el("span", {class:"pos", text:item.pos}) : null, el("span", {class:"zh-big", text:item.zh})));
  area.appendChild(audioFor(item));
  area.appendChild(slotsEl);
  var rows = ["qwertyuiop", "asdfghjkl", "zxcvbnm"];
  var kb = el("div", {class:"kb"});
  rows.forEach(function(row, ri){
    var r = el("div", {class:"kbrow"});
    row.split("").forEach(function(ch){
      var k = el("button", {class:"key", type:"button", text:ch, "aria-label":ch});
      k.addEventListener("mousedown", function(e){ e.preventDefault(); });
      k.addEventListener("click", function(){ api.type(ch); });
      r.appendChild(k);
    });
    if (ri === 2){
      var b = el("button", {class:"key wide", type:"button", "aria-label":"刪除"}); b.innerHTML = ICON.bs;
      b.addEventListener("mousedown", function(e){ e.preventDefault(); });
      b.addEventListener("click", function(){ api.back(); });
      r.appendChild(b);
    }
    kb.appendChild(r);
  });
  dock.appendChild(el("div", {class:"dockrow"}, hintBtn, checkBtn));
  dock.appendChild(kb);
  draw();
  say(item.en, 0.9);
}

/* ---------- stage: cloze ---------- */
function rCloze(item){

  var blank = el("span", {class:"blank", text:"     "});

/* ---------- keyboard (physical) ---------- */
document.addEventListener("keydown", function(e){
  if (S.screen !== "play" || !S.run || !S.run.q) return;
  var t = e.target; if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "BUTTON")) return;
  var q = S.run.q;
  if (q.over){ if (e.key === "Enter"){ e.preventDefault(); next(); } return; }
  if (q.kind !== "spell" || !q.api || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[a-zA-Z]$/.test(e.key)){ e.preventDefault(); q.api.type(e.key.toLowerCase()); }
  else if (e.key === "Backspace"){ e.preventDefault(); q.api.back(); }
  else if (e.key === "Enter"){ e.preventDefault(); q.api.check(); }
});

/* ---------- finish ---------- */
function finishRun(){
  var r = S.run, total = r.seq.length, pct = r.sum / total, info = {scored:r.scored, pct:pct, right:r.right, total:total, first:false, sc:0, newLayer:0};
  TTS.stop();
  var rec = S.rec;
  if (r.scored){
    var m = r.mission, prev = rec.m[m.id];
    info.first = !prev; info.sc = Math.round(pct * 20);
    var cur = prev || {score:0, pct:0, time:0, runs:0};
    cur.runs++; cur.time += Math.round(r.time);
    if (info.sc >= cur.score){ cur.score = info.sc; cur.pct = pct; }
    rec.m[m.id] = cur; info.m = m; info.best = cur.score;
    if (info.first) info.newLayer = m.layer;
    Object.keys(r.itemMin).forEach(function(id){ if (r.itemMin[id] < 1) rec.weak[id] = 1; else delete rec.weak[id]; });
  } else {
    Object.keys(r.itemMin).forEach(function(id){ if (r.itemMin[id] >= 1) delete rec.weak[id]; });
  }
  rec.updated = Date.now(); save();
  tone(SND.done);
  renderResult(info, r); show("result");
}
function renderResult(info, r){
  var box = $("#result"); box.textContent = "";
  var missed = Object.keys(r.itemMin).filter(function(id){ return r.itemMin[id] < 1; });
  var c = el("div", {class:"center"});
  if (info.scored){
    c.appendChild(el("div", {class:"stage-no", text:info.m.name + " 完成"}));
    c.appendChild(el("div", {class:"bigscore"}, String(info.sc), el("span", {class:"muted", style:"font-size:24px", text:" / 20"})));
    c.appendChild(starsEl(starsFor(info.pct)));
    if (info.best > info.sc) c.appendChild(el("p", {class:"muted small", text:"你的最佳成績是 " + info.best + " 分，成績單會用最佳的。"}));
    var sc = makeScene(); sc.style.width = "100%"; c.appendChild(sc); paintScene(sc, doneLayers(), info.newLayer);
    if (info.first) c.appendChild(el("div", {class:"reveal-line", text:info.m.reveal}));
  } else {
    c.appendChild(el("div", {class:"stage-no", text:"錯字練習完成"}));
    c.appendChild(el("div", {class:"bigscore"}, String(info.right), el("span", {class:"muted", style:"font-size:24px", text:" / " + info.total})));
    c.appendChild(el("p", {class:"muted", text:"答對的題數。這個練習不影響成績。"}));
  }
  if (missed.length){
    c.appendChild(el("p", {class:"muted small", text:"這次需要再注意的：" }));
    c.appendChild(el("div", {class:"chips"}, missed.map(function(id){ return el("span", {class:"wchip", text:ITEM[id].en}); })));
  } else c.appendChild(el("p", {class:"muted", text:"這次全部都答對，沒有需要加強的字。"}));
  var acts = el("div", {class:"stack"});
  var idx = info.scored ? MISSIONS.indexOf(info.m) : -1;
  if (info.scored && idx < MISSIONS.length - 1) acts.appendChild(el("button", {class:"btn primary block", type:"button", text:"下一個任務", onclick:function(){ openPreview(idx + 1); }}));
  if (info.scored && idx === MISSIONS.length - 1 || doneCount() === 5) acts.appendChild(el("button", {class:"btn glow block", type:"button", text:"查看成績單", onclick:function(){ renderReport(); show("report"); }}));
  if (weakIds().length) acts.appendChild(el("button", {class:"btn secondary block", type:"button", text:"練習容易錯的字", onclick:startPractice}));
  acts.appendChild(el("button", {class:"btn secondary block", type:"button", text:"回首頁", onclick:function(){ renderHome(); show("home"); }}));
  c.appendChild(acts);
  box.appendChild(c);
}

/* ---------- report ---------- */
function fmtNow(){
  try { return new Date().toLocaleString("zh-TW", {year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false}); }
  catch(e){ return new Date().toString(); }
}
function renderReport(){
  var r = S.rec, box = $("#report"); box.textContent = "";
  var total = totalScore(), secs = 0, dc = doneCount(), when = fmtNow();
  MISSIONS.forEach(function(m){ if (r.m[m.id]) secs += r.m[m.id].time || 0; });
  var mins = Math.max(dc ? 1 : 0, Math.round(secs / 60));
  var rep = el("div", {class:"report"});
  rep.appendChild(el("div", {class:"rh"}, el("b", {text:"B1L3 單字挑戰 成績單"}), el("span", {text:when})));
  rep.appendChild(el("div", {class:"who"},
    el("div", {}, el("small", {text:"班級"}), el("strong", {text:r.cls || "—"})),
    el("div", {}, el("small", {text:"座號"}), el("strong", {class:"word", text:String(r.seat)})),
    el("div", {}, el("small", {text:"姓名"}), el("strong", {text:r.name}))
  ));
  rep.appendChild(el("div", {}, el("div", {class:"total"}, el("span", {class:"score-num", text:String(total)}), el("span", {class:"muted", text:"/ 100 分"})),
    el("div", {class:"muted small", text:"完成 " + dc + " / 5 任務　用時約 " + mins + " 分鐘"})));
  var list = el("div", {style:"display:grid; gap:10px"});
  MISSIONS.forEach(function(m){
    var rec = r.m[m.id], sc = rec ? rec.score : 0;
    list.appendChild(el("div", {class:"mr"}, el("span", {text:m.name.replace(" 片語", "")}), el("div", {class:"bar"}, el("i", {style:"width:" + (sc / 20 * 100) + "%"})), el("span", {class:"val", text:rec ? sc + " / 20" : "未完成"})));
  });
  rep.appendChild(list);
  var wk = weakIds();
  if (wk.length){
    rep.appendChild(el("div", {}, el("div", {class:"muted small", text:"需要再加強"}), el("div", {class:"chips", style:"justify-content:flex-start; margin-top:6px"}, wk.map(function(id){ return el("span", {class:"wchip", text:ITEM[id].en}); }))));
  }
  box.appendChild(rep);
  var text = "B1L3單字挑戰｜" + (r.cls ? r.cls + " " : "") + r.seat + "號 " + r.name + "｜總分 " + total + "/100｜完成 " + dc + "/5｜" + when;
  var cb = el("div", {class:"copybox", style:"margin-top:14px"});
  var status = el("p", {class:"muted small", text:"請把上面的成績單畫面截圖給老師。"});
  cb.appendChild(status);
  cb.appendChild(el("button", {class:"btn secondary block", type:"button", text:"複製文字成績", onclick:function(){
    var done = function(){ status.textContent = "已複製，可以貼到 LINE 或作業區。"; };
    var fallback = function(){
      var inp = el("input", {type:"text", readonly:true, value:text, "aria-label":"成績文字"});
      cb.appendChild(inp); inp.focus(); inp.select(); status.textContent = "請長按文字並選擇「拷貝」。";
    };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch(e){ fallback(); }
  }}));
  cb.appendChild(el("button", {class:"btn ghost block", type:"button", text:"回首頁", onclick:function(){ renderHome(); show("home"); }}));
  box.appendChild(cb);
}

/* ---------- wiring ---------- */
$("#btn-exit").addEventListener("click", function(){ $("#exitbar").hidden = !$("#exitbar").hidden; });
$("#exit-no").addEventListener("click", function(){ $("#exitbar").hidden = true; });
$("#exit-yes").addEventListener("click", function(){ TTS.stop(); S.run = null; renderHome(); show("home"); });
$("#btn-mute").addEventListener("click", function(){ S.muted = !S.muted; $("#mute-t").textContent = S.muted ? "音效關" : "音效開"; });
initLogin();
show("login");
})();
</script>
